apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: auth
type: Opaque
stringData:
  # Ajuste usuário/senha/host ao seu Postgres no namespace auth (ex.: Service postgres)
  DATABASE_URL: postgres://auth_user:auth_password@postgres.auth.svc.cluster.local:5432/auth_db
  MASTER_KEY: admin-secreto-123
