# Opcional: use IRSA (EKS) e não monte chaves. Para dev, preencha os valores.
apiVersion: v1
kind: Secret
metadata:
  name: analytics-secrets
  namespace: analytics
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "PREENCHER_OU_USAR_IRSA"
  AWS_SECRET_ACCESS_KEY: "PREENCHER_OU_USAR_IRSA"
  # Opcional (credencial temporária)
  AWS_SESSION_TOKEN: ""